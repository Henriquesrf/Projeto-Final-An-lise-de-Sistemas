<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Recanto Feliz</title>

    <link rel="stylesheet" href="../css/Cadastro Style.css">
</head>

<body>

    <div class="cadastro">

        <form action="../html/Login.html" class="form-cadastro">

            <h1>Recanto Feliz</h1>

            <p class="subtitulo">
                Cadastro de Cliente
            </p>

            <label class="textlabel">Nome Completo</label>

            <input 
                class="campotexto"
                type="text"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label class="textlabel">Email</label>

            <input 
                class="campotexto"
                type="email"
                name="email"
                placeholder="Digite seu email"
                required
            >

            <label class="textlabel">Telefone</label>

            <input 
                class="campotexto"
                type="tel"
                name="telefone"
                placeholder="(51) 99999-9999"
                required
            >

            <label class="textlabel">CPF</label>

            <input 
                class="campotexto"
                type="text"
                name="cpf"
                placeholder="Digite seu CPF"
                required
            >

            <label class="textlabel">Confirmar Senha</label>

            <input 
                class="campotexto"
                type="password"
                name="confirmarsenha"
                placeholder="Confirme sua senha"
                required
            >

            <button id="btncadastro" type="submit">
                Cadastrar Pessoa
            </button>

        </form>

    </div>

</body>

<footer>
    <p>© Todos os direitos reservados a Recanto Feliz - 2026</p>
</footer>

</html>
