<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - Recanto Feliz</title>

    <link rel="stylesheet" href="../css/Login style.css">
</head>

<body>

    <div class="container-login">

        <form action="../html/catalogo" class="form-login">

            <h1>Recanto Feliz</h1>

            <p class="subtitulo">
                Sistema de Gerenciamento Hoteleiro
            </p>

            <label class="textlabel">Usuário ou Email</label>

            <input 
                class="campotexto" 
                type="text" 
                name="usuario"
                placeholder="Digite seu usuário ou email"
                required
            >

            <label class="textlabel">Senha</label>

            <input 
                class="campotexto" 
                type="password" 
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button id="btnlogin" type="submit">
                Entrar
            </button>

            <p class="cadastro-link">
                Não possui conta?
                <a href="Cadastro.html">Cadastre-se</a>
            </p>

        </form>

    </div>

</body>

<footer>
    <p> © Todos os direitos reservados a Recanto Feliz - 2026</p>
</footer>

</html>
